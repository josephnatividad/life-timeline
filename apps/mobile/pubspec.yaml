name: life_timeline
description: Phase 1 mobile foundation for the Life Timeline working project.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.0.9
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # 11.x assumes AGP 9 built-in Kotlin, which Flutter 3.44 does not yet enable
  # for applications. 10.3.10 retains mobile save support and the Tika CVE fix.
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_local_notifications: ^22.2.0
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^5.1.0
  go_router: ^17.4.0
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  hugeicons: ^1.1.7
  image: ^4.9.1
  image_picker: ^1.2.3
  local_auth: ^3.0.2
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  # 13.x conflicts with package_info_plus 9.x through incompatible win32
  # constraints. 12.0.2 retains the modern SharePlus API and mobile fixes.
  share_plus: ^12.0.2
  timezone: ^0.11.1
  # Keep the public API on the last 0.9.0 maintenance release while Flutter
  # stable still uses the AGP 9 legacy-KGP compatibility bridge.
  workmanager: 0.9.0+3

# workmanager_android 0.9.0+3 assumes AGP built-in Kotlin is enabled, but
# Flutter stable 3.44 explicitly supports enabling it only from Flutter 3.47.
# Pin the complete federated 0.9.0 release set so its interfaces cannot drift.
# Remove these overrides after Flutter 3.47+ is stable and the complete native
# plugin graph has passed the built-in Kotlin release build audit.
dependency_overrides:
  workmanager_android: 0.9.0+2
  workmanager_apple: 0.9.1+2
  workmanager_platform_interface: 0.9.1+1

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
