name: life_timeline
description: Phase 1 mobile foundation for the Life Timeline working project.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.0.9
  cryptography: ^2.9.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # 11.x assumes AGP 9 built-in Kotlin, which Flutter 3.44 does not yet enable
  # for applications. 10.3.10 retains mobile save support and the Tika CVE fix.
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.4.0
  google_mlkit_text_recognition: 0.15.1
  hugeicons: ^1.1.7
  image: ^4.9.1
  image_picker: ^1.2.3
  local_auth: ^3.0.2
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
